name: Bug Report
description: 回報可重現的程式、文件或公開 Demo 問題
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝回報。安全漏洞請改用 Private Vulnerability Reporting，不要放在公開 Issue。
  - type: dropdown
    id: area
    attributes:
      label: 問題範圍
      options:
        - Source Code／CLI
        - Notebook／Colab
        - Dataset／Model Artifact
        - 公開 Demo
        - 文件／連結
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit 或 Release
      placeholder: v1.2.0 或完整 Commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小重現步驟
      description: 請勿貼上 Token、個資或機密影像。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為與實際結果
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 確認事項
      options:
        - label: 我沒有在公開內容中放入 Token、個資或未公開漏洞細節。
          required: true
        - label: 我理解這是 research／evaluation 專案，不是 production AOI。
          required: true
