name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Restore the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Test
        run: uv run --frozen pytest -q

      # Re-checks the live Hugging Face Hub, so upstream licence or gating drift is
      # caught on every run. Written to a temporary path so the committed evidence
      # hash chain (license_chain -> model_license_verification) stays untouched.
      - name: Re-verify upstream model licences against the live Hub
        run: >
          uv run --frozen python scripts/verify_model_licenses.py
          --output "${{ runner.temp }}/model_license_verification.json"

      # model_license_verification_fresh has a 24-hour window that exists for release
      # time, not for CI: report age says nothing about the commit under test, and the
      # step above already proves the upstream licences right now. It is reported but
      # not gating here. A release runs this script with no flags.
      - name: Audit committed publication evidence and contributor identity
        run: >
          uv run --frozen python scripts/verify_publish.py
          --allow-stale-license-check
          --revision "${{ github.event.pull_request.head.sha || github.sha }}"
