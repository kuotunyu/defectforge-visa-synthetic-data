[project]
name = "defectforge-visa"
version = "0.1.0"
description = "Few-shot industrial defect synthesis on VisA: an open-source replication of the NVIDIA GTC 2026 Cosmos AnomalyGen methodology."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"

# Versions re-verified against the official indexes on 2026-07-27 and pinned in
# uv.lock. In particular: torch 2.13.0+cu130, torchvision 0.28.0+cu130,
# diffusers 0.39.0, transformers 5.14.1, peft 0.19.1, timm 1.0.28, and
# accelerate 1.14.0.
dependencies = [
    # core
    "numpy",
    "pyyaml",
    "python-dotenv",
    "tqdm",
    "pandas",
    # imaging
    "pillow",
    "opencv-python",          # cv2.seamlessClone for Poisson blending
    "scikit-image",
    "imagehash",              # pHash near-duplicate grouping
    # Procedural noise is implemented with NumPy/scikit-image. The unmaintained
    # `noise` 1.2.2 package has no modern Windows wheels and requires a C toolchain.
    # ml
    "torch",                  # installed from the cu130 index below, see docs/environment.md
    "torchvision",
    "transformers",           # DINOv2 feature extractor
    "timm",                   # required by Transformers vision backbones
    "diffusers",
    "peft",
    "accelerate",
    "safetensors",
    "scikit-learn",           # agglomerative clustering + silhouette
    # metrics
    "clean-fid",
    # reporting
    "matplotlib",
    # local-only M22 inspection demo
    "gradio",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "jupyter",
]

# ---------------------------------------------------------------------------
# PyTorch on native Windows.
#
# The win_amd64 wheels on PyPI are CPU-ONLY (~122 MB, versus ~527 MB for the Linux
# CUDA wheel). A bare `pip install torch` therefore installs a build that cannot
# see the RTX 4090 — and it fails silently, at runtime, as
# `torch.cuda.is_available() == False`.
#
# `explicit = true` means this index is used ONLY for the packages mapped to it
# below; everything else still resolves from PyPI.
#
# cu128 is NOT an option: that index tops out at torch 2.11.0 (verified
# 2026-07-27). CUDA 12.8 was dropped from the standard release matrix in 2.12.
# Confirmed present on cu130: torch-2.13.0+cu130-cp312-cp312-win_amd64.whl and
# torchvision-0.28.0+cu130-cp312-cp312-win_amd64.whl. Local driver 591.86 clears
# the 580.88 requirement.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
