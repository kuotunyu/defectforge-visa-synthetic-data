  allow_tf32: true
  horizontal_flip_probability: 0.5
  mask_loss_weight: 5.0
  checkpoint_every: 100
  sample_every: 100
  sample_inference_steps: 20
  sample_guidance_scale: 7.5
  sample_crop_ratio: 2.5
  report_every: 10

