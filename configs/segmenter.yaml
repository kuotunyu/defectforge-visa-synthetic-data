schema_version: 1
pipeline_version: "0.1.0"
hyperparameters_frozen: true

# SafeTensors checkpoint pinned to an immutable Hugging Face revision. The
# ADE20K classifier is replaced with a one-channel binary head; the encoder and
# SegFormer decode head remain pretrained.
model:
  name: segformer_b0
  repository: nvidia/segformer-b0-finetuned-ade-512-512
  revision: 489d5cd81a0b59fab9b7ea758d3548ebe99677da
  filename: model.safetensors
  sha256: 6ae39addd01de6b1b8bde2cf677d43a5cd733424b8d186de3f95d1c51fee23f9
  input_size: 512
  num_labels: 1
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# The 6e-5 learning rate follows the official Transformers SegFormer recipe.
# All formal groups use the exact same optimizer-step budget.
training:
  batch_size: 4
  total_steps: 500
  learning_rate: 0.00006
  weight_decay: 0.01
  warmup_steps: 50
  gradient_clip_norm: 1.0
  eval_every_steps: 100
  checkpoint_every_steps: 100
  early_stopping_patience: 5
  amp: true
  num_workers: 0

loss:
  dice_weight: 1.0
  bce_weight: 1.0
  smooth: 1.0

metrics:
  threshold: 0.5
  au_pro_max_fpr: 0.3
  au_pro_thresholds: 256

standard_augmentation:
  random_resized_crop_scale: [0.80, 1.00]
  random_resized_crop_ratio: [0.90, 1.10]
  horizontal_flip_probability: 0.5
  rotation_degrees: 10.0
  translation_fraction: 0.03
  scale: [0.95, 1.05]
  color_jitter: [0.15, 0.15, 0.10, 0.03]

# Group 9 (all_mixed) is an explicit alias of group 4 and is never rerun.
groups:
  real_only:
    real_bad: seed10
    standard_augmentation: false
  std_aug:
    real_bad: seed10
    standard_augmentation: true
  unfiltered_syn:
    real_bad: seed10
    standard_augmentation: false
    synthetic:
      view: unfiltered
      count: 500
  filtered_syn:
    real_bad: seed10
    standard_augmentation: false
    synthetic:
      view: filtered
      count: 500
  full_real:
    real_bad: full
    standard_augmentation: false
  procedural_only:
    real_bad: none
    standard_augmentation: false
    synthetic:
      view: unfiltered
      inputs: [stageA_procedural]
      count: 500
  copypaste_only:
    real_bad: seed10
    standard_augmentation: false
    synthetic:
      view: unfiltered
      inputs: [stageA_copypaste]
      count: 500
  diffusion_only:
    real_bad: seed10
    standard_augmentation: false
    synthetic:
      view: unfiltered
      inputs: [stageB_sd2/searched]
      count: 500
  all_mixed:
    alias_of: filtered_syn

output:
  run_subdirectory: seg
  results_csv: results/segmentation.csv
